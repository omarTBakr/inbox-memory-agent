# Local infrastructure for the email assistant. All values come from .env.
#   postgres  - memory store (pgvector) + MLflow and Langfuse databases
#   mlflow    - stage / DAG run tracking
#   langfuse* - LLM tracing, scores and prompt version history (v4: web, worker, clickhouse, redis, minio)
#   ollama    - optional (profile "ollama"); by default Ollama runs on the host
name: email-assistant

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet --no-cache-dir psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_BACKEND_DB}
             --artifacts-destination ${MLFLOW_ARTIFACT_ROOT}
             --serve-artifacts"
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:5000"
    volumes:
      - mlflow_artifacts:${MLFLOW_ARTIFACT_ROOT}

  langfuse-worker:
    image: langfuse/langfuse-worker:${LANGFUSE_VERSION}
    restart: unless-stopped
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    ports:
      - "127.0.0.1:3030:3030"

  langfuse-web:
    image: langfuse/langfuse:${LANGFUSE_VERSION}
    restart: unless-stopped
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_HOST}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "127.0.0.1:${LANGFUSE_PORT}:3000"

  # Langfuse UI for embedding in our app's Visualizations tab: only frame-ancestors changes
  # (to LANGFUSE_EMBED_ORIGINS); :3000 keeps Langfuse's own headers
  langfuse-embed:
    image: ${LANGFUSE_EMBED_IMAGE}
    restart: unless-stopped
    depends_on:
      - langfuse-web
    configs:
      - source: langfuse_embed
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:${LANGFUSE_EMBED_PORT}:80"

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["--requirepass", "${LANGFUSE_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for NVIDIA GPUs (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# Inline instead of a bind mount: works when the project sits on a drive Docker can't mount.
# Runs once, on the first start with an empty postgres_data volume.
configs:
  langfuse_embed:
    content: |
      map $$upstream_http_content_security_policy $$embed_csp {
          "~^(?<before>.*)frame-ancestors 'none'(?<after>.*)$$" "$${before}frame-ancestors ${LANGFUSE_EMBED_ORIGINS}$${after}";
          default $$upstream_http_content_security_policy;
      }
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          "" close;
      }
      server {
          listen 80;
          location / {
              proxy_pass http://langfuse-web:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_buffer_size 64k;
              proxy_buffers 8 64k;
              proxy_hide_header X-Frame-Options;
              proxy_hide_header Content-Security-Policy;
              add_header Content-Security-Policy $$embed_csp always;
              proxy_redirect ${LANGFUSE_HOST}/ ${LANGFUSE_EMBED_URL}/;
          }
      }

  postgres_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE DATABASE "${MLFLOW_BACKEND_DB}";
      CREATE DATABASE "${LANGFUSE_DB}";

volumes:
  postgres_data:
  mlflow_artifacts:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  ollama_models:
