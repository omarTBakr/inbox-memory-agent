name: notifications/responded
type: text
description: Push message after the assistant replied to an email on the user's behalf.
variables: [sender, subject, reasoning, escalation, replies, actions, warnings]
config: {}
template: |
  ✉️ Assistant replied for you

  Email from: {{sender}}
  Subject: {{subject}}
  Why: {{reasoning}}
  {{escalation}}

  {{replies}}

  Other actions:
  {{actions}}
  {{warnings}}
